<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000"><title>HawkBITR transmitting radio</title><g transform="translate(300 0)">
<title id="title">HawkBITR tactical briefing radio</title><desc id="desc">Olive handheld radio with a complete antenna, integrated speaker, mint LCD reading HAWK ONE and POLICY SITREP, and labelled rubber keypad. Original vector artwork.</desc>
<defs>
<linearGradient id="shell" x1="0" x2="1"><stop stop-color="#46503c"/><stop offset=".3" stop-color="#89906a"/><stop offset=".72" stop-color="#667052"/><stop offset="1" stop-color="#354334"/></linearGradient>
<linearGradient id="metal" x1="0" x2="1"><stop stop-color="#0c191f"/><stop offset=".35" stop-color="#53636a"/><stop offset=".55" stop-color="#26373d"/><stop offset="1" stop-color="#0b171b"/></linearGradient>
<linearGradient id="rubber" x2=".2" y2="1"><stop stop-color="#34454a"/><stop offset="1" stop-color="#101e24"/></linearGradient>
<linearGradient id="lcd" x2=".8" y2="1"><stop stop-color="#bce9c8"/><stop offset="1" stop-color="#79b6a2"/></linearGradient>
<pattern id="mesh" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="#56635d"/></pattern>
</defs>
