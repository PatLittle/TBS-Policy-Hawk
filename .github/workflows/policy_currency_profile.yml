name: Policy Currency Profile

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/policy_currency_profile.yml'
      - '.policy_currency_profile_bootstrap/**'
      - 'scripts/generate_policy_currency_profile.py'
      - 'data/policy_currency/**'

permissions:
  contents: write

concurrency:
  group: policy-hawk-content-writes
  cancel-in-progress: false

jobs:
  currency-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Assemble renderer bootstrap if present
        run: |
          if [[ -d .policy_currency_profile_bootstrap ]]; then
            cat .policy_currency_profile_bootstrap/part_* > scripts/generate_policy_currency_profile.py
            chmod +x scripts/generate_policy_currency_profile.py
          fi
          python -m py_compile scripts/generate_policy_currency_profile.py

      - name: Generate current-quarter currency profile
        run: |
          python scripts/generate_policy_currency_profile.py \
            --input data/policy_currency/2026-27Q2.json \
            --output screenshots/tbs_policy_hawk_currency_profile_2026-07-01_to_2026-09-30.svg \
            --logo assets/tbs-policy-hawk-logo-100px-transparent.png \
            --report PolicyEvolution2026-27Q2.md \
            --image-path screenshots/tbs_policy_hawk_currency_profile_2026-07-01_to_2026-09-30.svg

      - name: Update SKILL currency-profile instructions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('SKILL.md')
          text = path.read_text(encoding='utf-8')
          block = Path('.policy_currency_profile_bootstrap/skill_addendum.md').read_text(encoding='utf-8').strip()
          start = '<!-- policy-hawk:currency-profile-skill:start -->'
          end = '<!-- policy-hawk:currency-profile-skill:end -->'

          if start in text and end in text:
              a = text.index(start)
              b = text.index(end) + len(end)
              text = text[:a] + block + text[b:]
          else:
              anchor = '\n---\n\n## Implementation checklist'
              if anchor in text:
                  text = text.replace(anchor, '\n\n' + block + anchor, 1)
              else:
                  text = text.rstrip() + '\n\n' + block + '\n'

          path.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY

      - name: Commit generated profile and instructions
        run: |
          rm -rf .policy_currency_profile_bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A scripts/generate_policy_currency_profile.py \
            data/policy_currency/ \
            screenshots/tbs_policy_hawk_currency_profile_*.svg \
            PolicyEvolution2026-27Q2.md \
            SKILL.md \
            .policy_currency_profile_bootstrap
          if ! git diff --staged --quiet; then
            git commit -m 'feat: add quarterly policy currency profile'
            git push
          fi
