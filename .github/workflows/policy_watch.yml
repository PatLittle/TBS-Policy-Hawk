name: Policy Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,8,16 * * *'

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: policy-hawk-content-writes
  cancel-in-progress: false
  queue: max

jobs:
  policy-hawk:
    runs-on: ubuntu-latest
    env:
      TBS_POLICY_HAWK_USER_AGENT: "TBS-Policy-Hawk/1.0 (+https://github.com/TBS-Policy-Hawk)"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Ensure data directories exist
        run: mkdir -p data data/PINs screenshots

      - name: Fetch policy and PIN sources
        id: fetch
        run: |
          python scripts/fetch_feed.py
          python scripts/sync_pin_sources.py

          if [[ -n "$(git status --porcelain -- data/ PIN_sources.md)" ]]; then
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -n "$(git status --porcelain -- data/items.csv data/pin_events.csv)" ]]; then
            echo "activity_changes_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "activity_changes_detected=false" >> "$GITHUB_OUTPUT"
          fi

          python - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          new_items = Path("data/new_items.csv")
          reviewable = False
          if new_items.is_file():
              with new_items.open(encoding="utf-8-sig", newline="") as handle:
                  reviewable = next(csv.DictReader(handle), None) is not None

          pending_path = Path("data/pending_enrichment.json")
          pending = False
          if pending_path.is_file():
              try:
                  pending = bool(json.loads(pending_path.read_text(encoding="utf-8")))
              except (json.JSONDecodeError, OSError):
                  pending = True

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"reviewable_changes_detected={str(reviewable).lower()}\n")
              output.write(f"enrichment_pending={str(pending).lower()}\n")
          PY

      - name: Generate quarterly policy activity heatmap
        if: steps.fetch.outputs.activity_changes_detected == 'true'
        run: python scripts/generate_policy_heatmap.py

      - name: Commit and push data updates
        if: steps.fetch.outputs.changes_detected == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ PIN_sources.md README.md screenshots/tbs_policy_hawk_heatmap_*.png
          git commit -m 'chore: update policy data and documents'
          git push

      - name: Create issues and dispatch enrichment
        if: >-
          steps.fetch.outputs.reviewable_changes_detected == 'true' ||
          steps.fetch.outputs.enrichment_pending == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/create_issues_with_screenshots.py

      - name: Commit and push issue map and screenshots
        if: >-
          steps.fetch.outputs.reviewable_changes_detected == 'true' ||
          steps.fetch.outputs.enrichment_pending == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add screenshots/ data/issue_map.json data/pending_enrichment.json README.md *.png
          if ! git diff --staged --quiet; then
            git commit -m 'chore: create issues and update screenshots'
            git push
          fi

      - name: No source changes detected
        if: >-
          steps.fetch.outputs.changes_detected == 'false' &&
          steps.fetch.outputs.enrichment_pending == 'false'
        run: echo "No new policy or PIN activity detected."
