name: Issue Enrichment

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to enrich"
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: policy-hawk-content-writes
  cancel-in-progress: false
  queue: max

jobs:
  enrich-issue:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'policy-update') ||
      contains(github.event.issue.labels.*.name, '🍁CabinetDir🏛️')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install markitdown

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Enrich and analyze issue
        id: enrich
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
        run: python scripts/enrich_issue.py

      - name: Commit and push enrichment artifacts
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ screenshots/ PolicyEvolution*.md
          if test -f CabinetDirectives.md; then git add CabinetDirectives.md; fi
          if ! git diff --staged --quiet; then
            git commit -m "chore: enrich issue #${ISSUE_NUMBER}"
            git push
          fi

      - name: Preserve Cabinet evidence for an analysis retry
        if: failure() && steps.enrich.outputs.cabinet_issue == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if test -f data/CabinetDirectives/manifest.json; then
            git add CabinetDirectives.md data/CabinetDirectives/ screenshots/
            if ! git diff --staged --quiet; then
              git commit -m 'chore: retain Cabinet evidence for analysis retry'
              git push
            fi
          fi

      - name: Mark analysis complete
        if: steps.enrich.outputs.pin_autoanalyzed == 'true' || steps.enrich.outputs.cabinet_autoanalyzed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
        run: |
          gh label create '🪄📝AutoAnalyzed' --color 7057ff --force
          gh issue edit "$ISSUE_NUMBER" --add-label '🪄📝AutoAnalyzed'
